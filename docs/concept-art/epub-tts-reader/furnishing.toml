# ============================================================
# TTS SETTINGS
# ============================================================

[settings.tts]
engine = "system"
voice = "Aria"
voice_variant = "Natural"

rate = 1.2
pitch = 1.0
volume = 0.82

sentence_highlighting = true
word_highlighting = false
auto_scroll = true
follow_cursor = true

skip_backward_seconds = 15
skip_forward_seconds = 15

pause_at_paragraphs = 180
pause_at_headings = 350

[[settings.tts.pronunciations]]
match = "Elise"
speak_as = "ee-LEES"

[[settings.tts.pronunciations]]
match = "Wandering Horizon"
speak_as = "Wandering Horizon"


