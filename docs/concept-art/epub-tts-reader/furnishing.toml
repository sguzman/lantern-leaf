# LanternLeaf EPUB + TTS reader concept furnishing
#
# STATUS: visual/product reference only.
# This is a TOML-like semantic furnishing of the archived concept art.
# It is not a production parser/schema commitment and must not be treated
# as current implementation truth.

[concept]
id = "leafline-epub-tts-reader"
status = "visual-reference"
implementation_contract = false
source = "ChatGPT UI-authoring concept experiment"
created = "2026-09-15"
archived = "2026-09-16"

[ui]
id = "leafline-reader"
kind = "epub-reader"
title = "Leafline"
viewport = [1440, 1024]

[ui.layout]
type = "shell"
columns = [
    "library:260",
    "reader:1fr",
    "inspector:330",
]
rows = [
    "content:1fr",
    "tts:96",
]


# ============================================================
# LEFT SIDEBAR
# ============================================================

[region.library]
slot = "library"
layout = "column"
padding = 20
gap = 20
scroll = "vertical"

[[region.library.children]]
type = "brand"
icon = "leaf"
title = "Leafline"
subtitle = "Great stories live longer"

[[region.library.children]]
type = "nav"
id = "primary"

[[region.library.children.items]]
icon = "library"
label = "Library"
active = true

[[region.library.children.items]]
icon = "search"
label = "Search"

[[region.library.children.items]]
icon = "highlighter"
label = "Highlights"

[[region.library.children.items]]
icon = "bookmark"
label = "Bookmarks"

[[region.library.children.items]]
icon = "note"
label = "Notes"


# ------------------------------------------------------------
# Current book
# ------------------------------------------------------------

[[region.library.children]]
type = "book-summary"
id = "current-book"
label = "CURRENT BOOK"

cover = "wandering-horizon"
title = "The Wandering Horizon"
author = "Elise Carter"

chapter = 3
chapter_count = 14
progress = 0.28

[[region.library.children]]
type = "table-of-contents"
title = "TABLE OF CONTENTS"

[[region.library.children.items]]
number = 1
title = "A Different Dawn"

[[region.library.children.items]]
number = 2
title = "Maps and Motives"

[[region.library.children.items]]
number = 3
title = "The Mountain Path"
active = true

[[region.library.children.items]]
number = 4
title = "Valleys of Quiet"

[[region.library.children.items]]
number = 5
title = "The Longer Road"

[[region.library.children.items]]
number = 6
title = "Letters from Home"

[[region.library.children.items]]
number = 7
title = "A Wilder Sky"

[[region.library.children.items]]
number = 8
title = "Turning Points"


# ============================================================
# CENTRAL READER
# ============================================================

[region.reader]
slot = "reader"
layout = "column"
padding = [20, 28]
gap = 16


# ------------------------------------------------------------
# Reader toolbar
# ------------------------------------------------------------

[[region.reader.children]]
type = "toolbar"
id = "reader-toolbar"

[region.reader.children.layout]
type = "row"
align = "center"
justify = "between"

[[region.reader.children.children]]
type = "search"
placeholder = "Search in book..."
width = 390

[[region.reader.children.children]]
type = "cluster"
gap = 12

[[region.reader.children.children.children]]
type = "icon-button"
icon = "chevron-left"

[[region.reader.children.children.children]]
type = "icon-button"
icon = "chevron-right"

[[region.reader.children.children.children]]
type = "status"
text = "Chapter 3 of 14"

[[region.reader.children.children.children]]
type = "status"
text = "28%"

[[region.reader.children.children.children]]
type = "icon-button"
icon = "bookmark"

[[region.reader.children.children.children]]
type = "icon-button"
icon = "more-horizontal"


# ------------------------------------------------------------
# EPUB document surface
# ------------------------------------------------------------

[[region.reader.children]]
type = "document"
id = "epub-content"
grow = true
scroll = "vertical"

[region.reader.children.presentation]
mode = "continuous"
column_width = 690
page_margin = 72
horizontal_align = "center"

[region.reader.children.document]
format = "epub"
chapter = 3

[[region.reader.children.document.blocks]]
type = "eyebrow"
text = "CHAPTER 3"

[[region.reader.children.document.blocks]]
type = "heading"
level = 1
text = "The Mountain Path"

[[region.reader.children.document.blocks]]
type = "divider"
width = 40

[[region.reader.children.document.blocks]]
type = "paragraph"
id = "p1"
text = """
The trail began before dawn, a thin ribbon of earth threading through
pine and stone. The air was cold enough to make our breath visible,
and everything felt sharper — the crunch of gravel, the distant rush
of water, the steady rhythm of our own footsteps.
"""

[[region.reader.children.document.blocks]]
type = "paragraph"
id = "p2"
text = """
As the first light touched the ridge, the valley below unfolded like a
map, rivers of mist curling between the trees. I stopped for a moment,
taking it all in, reminded that some of the most important discoveries
arrive not with noise, but with stillness.
"""

[[region.reader.children.document.blocks]]
type = "paragraph"
id = "p3"
text = """
We walked for hours, following the mountain's gentle insistence
upward. Each turn revealed something new — a wider view, a quieter
mind, a little more space between who I had been and who I was
becoming. The journey, I realized, was not just about reaching the top,
but about learning to notice the beauty in the climb.
"""

[[region.reader.children.document.blocks]]
type = "quote"
text = """
Not all those who wander are lost,
but many find exactly what they need.
"""


# ------------------------------------------------------------
# Active TTS projection into document
# ------------------------------------------------------------

[region.reader.children.tts_projection]
enabled = true
follow_playback = true
auto_scroll = true

current_block = "p2"
current_sentence = 1

highlight_mode = "sentence"
highlight_style = "soft-fill"

[region.reader.children.tts_projection.current_range]
start = 0
end = 104


# ============================================================
# RIGHT INSPECTOR
# ============================================================

[region.inspector]
slot = "inspector"
layout = "column"
padding = 20
gap = 20
scroll = "vertical"

[[region.inspector.children]]
type = "header"
title = "Reading Settings"

[[region.inspector.children.actions]]
type = "text-button"
label = "Reset"


# ------------------------------------------------------------
# Inspector tabs
# ------------------------------------------------------------

[[region.inspector.children]]
